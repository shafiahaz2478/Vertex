<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashcam Pothole Detector</title>
    <!-- Import ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background: #111;
            color: white;
            margin: 0;
            padding: 10px;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video {
            display: block;
            border-radius: 8px;
            width: 100%;
            max-width: 640px;
            background: #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 640px;
            margin: 0 auto 10px auto;
            padding: 10px;
            background: #222;
            border-radius: 8px;
            font-size: 14px;
        }
        .status-text { color: #4ade80; font-weight: bold; flex: 1; text-align: left; }
        .queue-text { color: #facc15; flex: 1; text-align: right; }

        /* New Button Styles */
        .capture-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .capture-btn.armed {
            background: #ef4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="status-bar">
        <span id="status" class="status-text">Loading AI Model...</span>
        <!-- New Capture Button -->
        <button id="capture-btn" class="capture-btn">📸 Capture Next</button>
        <span id="queue-status" class="queue-text">Queue: 0</span>
    </div>

    <div class="container">
        <!-- Video element for phone camera feed -->
        <video id="video" autoplay playsinline muted></video>
        <!-- Canvas to draw the bounding boxes overlay -->
        <canvas id="overlay"></canvas>
    </div>

    <script>
        // --- 1. Configuration ---
        const BATCH_API_URL = "https://vertex-backend-hf09.onrender.com/api/v1/potholes/batch";
        const SINGLE_API_URL = "https://vertex-backend-hf09.onrender.com/api/v1/potholes"; // Added for image uploads

        const CONFIDENCE_THRESHOLD = 0.40;
        const INPUT_SIZE = 640;
        const inputShape = [1, 3, INPUT_SIZE, INPUT_SIZE];

        const BATCH_INTERVAL_MS = 10000;
        let potholeBuffer = [];
        let lastUploadTime = Date.now();
        let lastGPS = { lat: null, lon: null };
        let captureNextImage = false; // New state flag

        // DOM Elements
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const statusEl = document.getElementById('status');
        const queueEl = document.getElementById('queue-status');
        const captureBtn = document.getElementById('capture-btn'); // New element

        let session;

        // --- 2. Button Event Listener ---
        captureBtn.addEventListener('click', () => {
            captureNextImage = true;
            captureBtn.classList.add('armed');
            captureBtn.innerText = "📸 Waiting for Pothole...";
        });

        // --- 3. Initialize GPS Tracking ---
        function startGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        lastGPS.lat = position.coords.latitude;
                        lastGPS.lon = position.coords.longitude;
                    },
                    (error) => console.error("GPS Error:", error),
                    { enableHighAccuracy: true }
                );
            }
        }

        // --- 4. Initialize AI Model ---
        async function loadModel() {
            try {
                ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/';
                session = await ort.InferenceSession.create('pothole.onnx', {
                    executionProviders: ['wasm'],
                    graphOptimizationLevel: 'all'
                });
                statusEl.innerText = "Model Ready.";
                startGPS();
                startCamera();
            } catch (e) {
                statusEl.innerText = "Error loading model!";
                statusEl.style.color = "#ef4444";
                console.error(e);
            }
        }

        // --- 5. Start Camera ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: INPUT_SIZE, height: INPUT_SIZE }
                });
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                    statusEl.innerText = "Scanning...";
                    setTimeout(detectFrame, 500);
                };
            } catch (err) {
                statusEl.innerText = "Camera access denied.";
            }
        }

        // --- 6. Preprocess Image ---
        function preprocess(canvasData) {
            const floatData = new Float32Array(INPUT_SIZE * INPUT_SIZE * 3);
            for (let i = 0; i < INPUT_SIZE * INPUT_SIZE; i++) {
                floatData[i] = canvasData[i * 4] / 255.0;         // Red
                floatData[INPUT_SIZE * INPUT_SIZE + i] = canvasData[i * 4 + 1] / 255.0; // Green
                floatData[2 * INPUT_SIZE * INPUT_SIZE + i] = canvasData[i * 4 + 2] / 255.0; // Blue
            }
            return new ort.Tensor('float32', floatData, inputShape);
        }

        // --- 7. Upload Single Image Report ---
        async function uploadSingleWithImage(confidence, base64Image) {
            statusEl.innerText = "Uploading Image...";
            try {
                const response = await fetch(SINGLE_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude: lastGPS.lat,
                        longitude: lastGPS.lon,
                        confidence: parseFloat(confidence.toFixed(2)),
                        image_base64: base64Image
                    })
                });

                if (response.ok) {
                    statusEl.innerText = "Image Sent!";
                    setTimeout(() => statusEl.innerText = "Scanning...", 2000);
                } else {
                    statusEl.innerText = "Upload Failed.";
                    setTimeout(() => statusEl.innerText = "Scanning...", 2000);
                }
            } catch (err) {
                console.error("Upload Error:", err);
            }
        }

        // --- 8. The API Batching Logic ---
        async function processDetection(confidence) {
            if (!lastGPS.lat || !lastGPS.lon) return;

            const isDuplicate = potholeBuffer.some(p => {
                return Math.abs(p.latitude - lastGPS.lat) < 0.0001 &&
                       Math.abs(p.longitude - lastGPS.lon) < 0.0001;
            });

            if (!isDuplicate) {
                potholeBuffer.push({
                    latitude: lastGPS.lat,
                    longitude: lastGPS.lon,
                    confidence: parseFloat(confidence.toFixed(2)),
                    detected_at: new Date().toISOString()
                });
                queueEl.innerText = `Queue: ${potholeBuffer.length}`;
            }

            if (Date.now() - lastUploadTime > BATCH_INTERVAL_MS && potholeBuffer.length > 0) {
                await uploadBatch();
            }
        }

        async function uploadBatch() {
            const payload = [...potholeBuffer];
            potholeBuffer = [];
            queueEl.innerText = `Queue: 0 (Uploading...)`;

            try {
                const response = await fetch(BATCH_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ potholes: payload })
                });

                if (response.ok) {
                    lastUploadTime = Date.now();
                    queueEl.innerText = `Queue: 0 (Synced)`;
                } else {
                    potholeBuffer = [...payload, ...potholeBuffer];
                    queueEl.innerText = `Queue: ${potholeBuffer.length} (Sync Failed)`;
                }
            } catch (err) {
                potholeBuffer = [...payload, ...potholeBuffer];
            }
        }

        // --- 9. Run AI Loop ---
        async function detectFrame() {
            if (!session) return;

            const offscreen = document.createElement('canvas');
            offscreen.width = INPUT_SIZE;
            offscreen.height = INPUT_SIZE;
            const offscreenCtx = offscreen.getContext('2d');
            offscreenCtx.drawImage(video, 0, 0, INPUT_SIZE, INPUT_SIZE);

            const imageData = offscreenCtx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
            const tensor = preprocess(imageData);

            try {
                const results = await session.run({ images: tensor });
                const output = results[session.outputNames[0]].data;

                ctx.clearRect(0, 0, overlay.width, overlay.height);

                for (let i = 0; i < 8400; i++) {
                    const confidence = output[i + 8400 * 4];

                    if (confidence > CONFIDENCE_THRESHOLD) {
                        const cx = output[i];
                        const cy = output[i + 8400];
                        const w = output[i + 8400 * 2];
                        const h = output[i + 8400 * 3];

                        const scaleX = overlay.width / INPUT_SIZE;
                        const scaleY = overlay.height / INPUT_SIZE;

                        const x = (cx - w / 2) * scaleX;
                        const y = (cy - h / 2) * scaleY;

                        ctx.strokeStyle = '#22c55e';
                        ctx.lineWidth = 4;
                        ctx.strokeRect(x, y, w * scaleX, h * scaleY);

                        // If armed, take the picture and send to the single ingest endpoint
                        if (captureNextImage && lastGPS.lat && lastGPS.lon) {
                            captureNextImage = false; // Disarm
                            captureBtn.classList.remove('armed');
                            captureBtn.innerText = "📸 Capture Next";

                            // Extract compressed JPEG from canvas
                            const base64Image = offscreen.toDataURL('image/jpeg', 0.7);
                            uploadSingleWithImage(confidence, base64Image);
                        } else {
                            // Otherwise, behave normally and add to batch
                            processDetection(confidence);
                        }

                        break;
                    }
                }
            } catch (e) {
                console.error("Inference error:", e);
            }

            setTimeout(detectFrame, 500);
        }

        loadModel();
    </script>
</body>
</html>
