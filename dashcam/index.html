<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashcam Pothole Detector</title>
    <!-- Import ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background: #111;
            color: white;
            margin: 0;
            padding: 10px;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video {
            display: block;
            border-radius: 8px;
            width: 100%;
            max-width: 640px;
            background: #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        #status-bar {
            display: flex;
            justify-content: space-between;
            max-width: 640px;
            margin: 0 auto 10px auto;
            padding: 10px;
            background: #222;
            border-radius: 8px;
            font-size: 14px;
        }
        .status-text { color: #4ade80; font-weight: bold; }
        .queue-text { color: #facc15; }
    </style>
</head>
<body>

    <div id="status-bar">
        <span id="status" class="status-text">Loading AI Model...</span>
        <span id="queue-status" class="queue-text">Queue: 0</span>
    </div>

    <div class="container">
        <!-- Video element for phone camera feed -->
        <video id="video" autoplay playsinline muted></video>
        <!-- Canvas to draw the bounding boxes overlay -->
        <canvas id="overlay"></canvas>
    </div>

    <script>
        // --- 1. Configuration ---
        // Your live Railway backend API
        const BACKEND_URL = "https://vertex-backend-hf09.onrender.com/api/v1/potholes/batch";

        // AI Settings
        const CONFIDENCE_THRESHOLD = 0.40; // Lowered slightly to ensure detections trigger
        const INPUT_SIZE = 640; // Change to 320 if you re-exported a smaller model
        const inputShape = [1, 3, INPUT_SIZE, INPUT_SIZE];

        // Batch Upload Settings
        const BATCH_INTERVAL_MS = 10000; // Upload every 10 seconds for demo (usually 10 mins in prod)
        let potholeBuffer = [];
        let lastUploadTime = Date.now();
        let lastGPS = { lat: null, lon: null };

        // DOM Elements
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const statusEl = document.getElementById('status');
        const queueEl = document.getElementById('queue-status');

        let session;

        // --- 2. Initialize GPS Tracking ---
        function startGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        lastGPS.lat = position.coords.latitude;
                        lastGPS.lon = position.coords.longitude;
                    },
                    (error) => console.error("GPS Error:", error),
                    { enableHighAccuracy: true }
                );
            }
        }

        // --- 3. Initialize AI Model ---
        async function loadModel() {
            try {
                ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/';
                // Using WASM with optimizations for stable CPU fallback
                session = await ort.InferenceSession.create('pothole.onnx', {
                    executionProviders: ['wasm'],
                    graphOptimizationLevel: 'all'
                });
                statusEl.innerText = "Model Ready. Starting Camera...";
                startGPS();
                startCamera();
            } catch (e) {
                statusEl.innerText = "Error loading model!";
                statusEl.style.color = "#ef4444";
                console.error(e);
            }
        }

        // --- 4. Start Camera ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: INPUT_SIZE, height: INPUT_SIZE }
                });
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                    statusEl.innerText = "Scanning for Potholes...";
                    // Start the detection loop
                    setTimeout(detectFrame, 500);
                };
            } catch (err) {
                statusEl.innerText = "Camera access denied.";
            }
        }

        // --- 5. Preprocess Image ---
        function preprocess(canvasData) {
            const floatData = new Float32Array(INPUT_SIZE * INPUT_SIZE * 3);
            for (let i = 0; i < INPUT_SIZE * INPUT_SIZE; i++) {
                // Normalize pixel values to 0.0 - 1.0 for YOLOv8
                floatData[i] = canvasData[i * 4] / 255.0;         // Red
                floatData[INPUT_SIZE * INPUT_SIZE + i] = canvasData[i * 4 + 1] / 255.0; // Green
                floatData[2 * INPUT_SIZE * INPUT_SIZE + i] = canvasData[i * 4 + 2] / 255.0; // Blue
            }
            return new ort.Tensor('float32', floatData, inputShape);
        }

        // --- 6. The API Batching Logic ---
        async function processDetection(confidence) {
            if (!lastGPS.lat || !lastGPS.lon) return; // Ignore if no GPS fix

            // Check if we already logged a pothole very close to here
            const isDuplicate = potholeBuffer.some(p => {
                return Math.abs(p.latitude - lastGPS.lat) < 0.0001 &&
                       Math.abs(p.longitude - lastGPS.lon) < 0.0001;
            });

            if (!isDuplicate) {
                potholeBuffer.push({
                    latitude: lastGPS.lat,
                    longitude: lastGPS.lon,
                    confidence: parseFloat(confidence.toFixed(2)),
                    detected_at: new Date().toISOString()
                });
                queueEl.innerText = `Queue: ${potholeBuffer.length}`;
            }

            // Check if it's time to upload
            if (Date.now() - lastUploadTime > BATCH_INTERVAL_MS && potholeBuffer.length > 0) {
                await uploadBatch();
            }
        }

        async function uploadBatch() {
            const payload = [...potholeBuffer]; // Copy buffer
            potholeBuffer = []; // Clear current buffer immediately
            queueEl.innerText = `Queue: 0 (Uploading...)`;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ potholes: payload })
                });

                if (response.ok) {
                    lastUploadTime = Date.now();
                    queueEl.innerText = `Queue: 0 (Synced)`;
                } else {
                    // If failed, put them back in the queue
                    potholeBuffer = [...payload, ...potholeBuffer];
                    queueEl.innerText = `Queue: ${potholeBuffer.length} (Sync Failed)`;
                }
            } catch (err) {
                console.error("Upload Error:", err);
                potholeBuffer = [...payload, ...potholeBuffer];
            }
        }

        // --- 7. Run AI Loop ---
        async function detectFrame() {
            if (!session) return;

            // Draw video to hidden canvas to extract pixels
            const offscreen = document.createElement('canvas');
            offscreen.width = INPUT_SIZE;
            offscreen.height = INPUT_SIZE;
            const offscreenCtx = offscreen.getContext('2d');
            offscreenCtx.drawImage(video, 0, 0, INPUT_SIZE, INPUT_SIZE);

            const imageData = offscreenCtx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
            const tensor = preprocess(imageData);

            try {
                const results = await session.run({ images: tensor });
                const output = results[session.outputNames[0]].data;

                ctx.clearRect(0, 0, overlay.width, overlay.height);

                // YOLOv8 parsing
                for (let i = 0; i < 8400; i++) {
                    const confidence = output[i + 8400 * 4];

                    if (confidence > CONFIDENCE_THRESHOLD) {
                        const cx = output[i];
                        const cy = output[i + 8400];
                        const w = output[i + 8400 * 2];
                        const h = output[i + 8400 * 3];

                        const scaleX = overlay.width / INPUT_SIZE;
                        const scaleY = overlay.height / INPUT_SIZE;

                        const x = (cx - w / 2) * scaleX;
                        const y = (cy - h / 2) * scaleY;

                        // Draw Box
                        ctx.strokeStyle = '#22c55e'; // Bright green
                        ctx.lineWidth = 4;
                        ctx.strokeRect(x, y, w * scaleX, h * scaleY);

                        // Pass to API logic
                        processDetection(confidence);
                        break;
                    }
                }
            } catch (e) {
                console.error("Inference error:", e);
            }

            // Loop again after 500ms (2 FPS) to save battery and prevent browser freeze
            setTimeout(detectFrame, 500);
        }

        // Start everything
        loadModel();
    </script>
</body>
</html>
