<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Road Intelligence Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #root { height: 100vh; width: 100vw; display: flex; flex-direction: column; position: relative; }
        .map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* User location marker animation */
        .user-location-marker {
            width: 28px;
            height: 28px;
            position: relative;
            cursor: pointer;
        }
        .user-location-marker .dot {
            width: 16px;
            height: 16px;
            background-color: #2563eb; /* blue-600 */
            border: 2.5px solid white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            z-index: 2;
            transition: opacity 0.3s ease;
        }
        .user-location-marker .pulse {
            width: 38px;
            height: 38px;
            background-color: rgba(59, 130, 246, 0.4); /* blue-500 */
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            z-index: 1;
        }
        
        /* 3D Navigation Heading Pointer Puck */
        .user-location-marker .navigation-pointer {
            display: none;
            position: absolute;
            width: 44px;
            height: 44px;
            top: 50%;
            left: 50%;
            transform-origin: 50% 50%;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
            z-index: 3;
            transition: transform 0.25s cubic-bezier(0.2, 0, 0.2, 1);
        }
        .user-location-marker .navigation-pointer svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .user-location-marker.is-navigating .navigation-pointer { 
            display: block; 
        }
        .user-location-marker.is-navigating .dot { 
            opacity: 0; 
        }
        .user-location-marker.is-navigating .pulse { 
            width: 50px;
            height: 50px;
            background-color: rgba(37, 99, 235, 0.25);
            animation-duration: 1.6s; 
        }
        
        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0.9; }
            80%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
        }

        .dest-marker {
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
            animation: bounce-marker 1s ease-out;
        }

        @keyframes bounce-marker {
            0% { transform: translateY(-20px); opacity: 0; }
            60% { transform: translateY(3px); opacity: 1; }
            100% { transform: translateY(0); }
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .animate-scan { animation: scan 2s linear infinite; }
    </style>
    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18",
        "react-dom/client": "https://esm.sh/react-dom@18/client?external=react",
        "htm": "https://esm.sh/htm",
        "maplibre-gl": "https://esm.sh/maplibre-gl@3.6.2",
        "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
